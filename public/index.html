<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welkom USA SMS</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-pending">
  <div id="appStatus" class="startup" role="status" aria-live="polite">
    <div class="startup-card">
      <div class="brand-mark">WE</div>
      <strong>Welkom USA SMS</strong>
      <span>Checking your staff session...</span>
    </div>
  </div>

  <div id="app" class="app-shell">
    <header id="staffHeader" class="staff-header hidden">
      <div class="brand-row">
        <div class="brand-mark">WE</div>
        <div>
          <strong>Welkom USA SMS</strong>
          <span>Warehouse messaging</span>
        </div>
      </div>
      <nav id="quickNav" class="quick-nav" aria-label="Quick navigation"></nav>
      <div class="user-menu">
        <button class="user-menu-button" type="button" aria-label="Staff account">
          <span id="staffAvatar" class="staff-avatar">WA</span>
          <span id="staffGreeting">Staff workspace</span>
        </button>
        <button id="logoutButton" class="logout-link" type="button">Logout</button>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="dialogLayer" class="dialog-layer hidden" role="presentation">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle">Confirm action</h2>
      <p id="dialogBody"></p>
      <div class="dialog-actions">
        <button id="dialogCancel" class="btn secondary" type="button">Cancel</button>
        <button id="dialogConfirm" class="btn primary" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
